<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 3D Previewer – Trial 3</title>
<script type="module" src="vendor/model-viewer.min.js"></script>
<style>
  :root { --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --accent:#2f6f4f; --bg:#f6f5f1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  p.sub { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .chips { display:flex; gap:8px; overflow-x:auto; margin:0 -16px 12px; padding:2px 16px 6px; -webkit-overflow-scrolling:touch; }
  .chips button { flex:0 0 auto; }
  .chips button { border:1px solid var(--line); background:#fff; color:var(--ink); padding:10px 14px; border-radius:999px; font-size:15px; cursor:pointer; }
  .chips button[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  model-viewer { width:100%; height: 56vh; min-height: 320px; max-height: 560px; background:#fff; border:1px solid var(--line); border-radius:16px; --poster-color: transparent; }
  .arbtn { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); background:var(--accent); color:#fff; border:0; border-radius:999px; padding:14px 22px; font-size:16px; font-weight:600; white-space:nowrap; cursor:pointer; }
  #bar { position:absolute; left:16px; right:16px; top:16px; height:4px; background:var(--line); border-radius:4px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
  #iosAR { display:block; text-align:center; margin-top:12px; }
  #iosAR[hidden] { display:none; }
  #iosAR img { display:inline-block; max-width:100%; height:auto; }
  .info { margin-top:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:15px; }
  .info b { display:block; font-size:13px; color:var(--muted); font-weight:600; margin-bottom:2px; }
  #note { margin-top:12px; padding:12px 14px; border-radius:12px; background:#fff7e6; border:1px solid #f1d9a5; font-size:14px; display:none; }
  details { margin-top:16px; font-size:13px; }
  summary { cursor:pointer; color:var(--muted); }
  pre { background:#111827; color:#d1fae5; padding:12px; border-radius:10px; overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:12px; }
  footer { margin-top:20px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>AI 3D Previewer</h1>
  <p class="sub">Trial 3 · rotate the item, then place it in your room at real size.</p>

  <div class="chips" id="chips"></div>

  <model-viewer id="mv"
    camera-controls touch-action="pan-y" loading="eager"
    shadow-intensity="1" exposure="1.1" camera-orbit="-30deg 75deg auto"
    ar ar-modes="webxr scene-viewer" ar-scale="fixed" ar-placement="floor"
    xr-environment
    alt="3D furniture preview">
    <button slot="ar-button" class="arbtn">View in your room</button>
    <div slot="progress-bar" id="bar"><i></i></div>
  </model-viewer>

  <!-- iPhone / iPad: Apple's own AR Quick Look link (same pattern apple.com uses) -->
  <a id="iosAR" rel="ar" href="models/sofa.usdz#allowsContentScaling=0" hidden>
    <img alt="View in your room" width="260" height="52"
      src="assets/ar-button.svg">
  </a>

  <div class="info"><b>Real size (width × height × depth)</b><span id="dims">Loading…</span></div>
  <div id="note"></div>

  <details open>
    <summary>Test report (send this back after testing)</summary>
    <pre id="log"></pre>
  </details>

  <footer>
    Furniture models from Poly Haven (CC0), reduced in size for the web. Viewer: Google model-viewer.
  </footer>
</main>

<script>
const MODELS = [
  { name: 'Leather sofa',  id: 'sofa' },
  { name: 'Armchair',      id: 'armchair' },
  { name: 'Lounge chair',  id: 'lounge' },
  { name: 'Dining chair',  id: 'dining' },
  { name: 'Round table',   id: 'roundtable' },
  { name: 'Coffee table',  id: 'coffeetable' },
  { name: 'Side table',    id: 'sidetable' },
  { name: 'Shelving unit', id: 'shelves' },
];
const iosAR = document.getElementById('iosAR');
const bar = document.getElementById('bar');
const QUICK_LOOK = document.createElement('a').relList.supports('ar');
const mv = document.getElementById('mv');
const logEl = document.getElementById('log');
const dimsEl = document.getElementById('dims');
const noteEl = document.getElementById('note');
const chips = document.getElementById('chips');
const lines = [];
function log(msg) { lines.push(msg); logEl.textContent = lines.join('\n'); }

function select(i) {
  dimsEl.textContent = 'Loading…';
  mv.src = 'models/' + MODELS[i].id + '.glb';
  iosAR.href = 'models/' + MODELS[i].id + '.usdz#allowsContentScaling=0';
  bar.style.display = 'block';
  [...chips.children].forEach((b, j) => b.setAttribute('aria-pressed', String(i === j)));
  log('model: ' + MODELS[i].name);
}
MODELS.forEach((m, i) => {
  const b = document.createElement('button');
  b.textContent = m.name;
  b.onclick = () => select(i);
  chips.appendChild(b);
});

iosAR.addEventListener('click', () => log('iOS AR link tapped: ' + iosAR.getAttribute('href')));
mv.addEventListener('progress', e => { bar.firstElementChild.style.width = (e.detail.totalProgress * 100) + '%'; });
mv.addEventListener('load', () => {
  bar.style.display = 'none';
  const d = mv.getDimensions();
  const cm = v => Math.round(v * 100);
  dimsEl.textContent = cm(d.x) + ' × ' + cm(d.y) + ' × ' + cm(d.z) + ' cm';
  log('loaded, size ' + dimsEl.textContent + ', canActivateAR=' + mv.canActivateAR + ', ms=' + Math.round(performance.now()));
  if (QUICK_LOOK) { iosAR.hidden = false; }
  else if (!mv.canActivateAR) {
    noteEl.style.display = 'block';
    noteEl.textContent = 'AR is not available on this device or browser, so this is the 3D view only. On a phone, open this page in Safari (iPhone) or Chrome (Android).';
  }
});
mv.addEventListener('error', e => log('ERROR: ' + (e.detail && (e.detail.type || JSON.stringify(e.detail)))));
mv.addEventListener('ar-status', e => log('ar-status: ' + e.detail.status));
mv.addEventListener('ar-tracking', e => log('ar-tracking: ' + e.detail.status));
mv.addEventListener('quick-look-button-tapped', () => log('quick-look-button-tapped'));
window.addEventListener('error', e => log('JS ERROR: ' + e.message));
document.addEventListener('visibilitychange', () => log('page ' + document.visibilityState));

(async () => {
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const quickLook = QUICK_LOOK;
  let webxr = false;
  try { webxr = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch (e) {}
  log('trial: 3');
  log('ua: ' + ua);
  log('iOS=' + isIOS + ' quickLook=' + quickLook + ' webxrAR=' + webxr);
  log('expected path: ' + (webxr ? 'WebXR (in page)' : quickLook ? 'Apple Quick Look' : /Android/.test(ua) ? 'Scene Viewer' : '3D view only'));
  select(0);
})();
</script>
</body>
</html>
