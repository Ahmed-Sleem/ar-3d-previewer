<script type="module">
// Builds the small demo furniture (in metres) and exports each as GLB + USDZ.
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

const mat = (color, roughness = 0.7, metalness = 0) => new THREE.MeshStandardMaterial({ color, roughness, metalness });
const WOOD = mat(0x9a6b3f, 0.6), DARKWOOD = mat(0x4a3324, 0.6), FABRIC = mat(0x4f7a6a, 0.95),
      CUSHION = mat(0xd9c9a8, 0.95), METAL = mat(0x2b2f36, 0.35, 0.8), SHADE = mat(0xf2e3c0, 0.9), WHITE = mat(0xf3f1ec, 0.5);

// box helper: size (w,h,d) centred at x,z with its bottom at y
function box(g, m, w, h, d, x, y, z) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y + h / 2, z); g.add(o); return o; }
function cyl(g, m, rTop, rBot, h, x, y, z) { const o = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 24), m); o.position.set(x, y + h / 2, z); g.add(o); return o; }

function chair() { const g = new THREE.Group(); const w = .45, d = .45, sh = .45, t = .04;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, WOOD, t, sz < 0 ? .9 : sh, t, sx * (w / 2 - t / 2), 0, sz * (d / 2 - t / 2));
  box(g, WOOD, w, t, d, 0, sh - t, 0); box(g, FABRIC, w - .04, .04, d - .04, 0, sh, 0);
  box(g, WOOD, w - 2 * t, .22, .025, 0, .64, -(d / 2 - t / 2)); return g; }

function table() { const g = new THREE.Group(); const w = 1.1, d = .6, h = .45, t = .05;
  box(g, WOOD, w, .04, d, 0, h - .04, 0);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, DARKWOOD, t, h - .04, t, sx * (w / 2 - .08), 0, sz * (d / 2 - .08));
  box(g, DARKWOOD, w - .2, .02, d - .2, 0, .12, 0); return g; }

function sofa() { const g = new THREE.Group(); const w = 2.0, d = .9, arm = .18;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, DARKWOOD, .06, .1, .06, sx * (w / 2 - .1), 0, sz * (d / 2 - .1));
  box(g, FABRIC, w, .22, d, 0, .1, 0);
  box(g, FABRIC, w, .5, .2, 0, .32, -(d / 2 - .1));
  for (const sx of [-1, 1]) box(g, FABRIC, arm, .32, d, sx * (w / 2 - arm / 2), .32, 0);
  const cw = (w - 2 * arm - .04) / 2;
  for (const sx of [-1, 1]) { box(g, CUSHION, cw - .02, .14, d - .32, sx * (cw / 2 + .01), .32, .1);
    box(g, CUSHION, cw - .06, .36, .14, sx * (cw / 2 + .01), .46, -(d / 2 - .27)); }
  return g; }

function shelf() { const g = new THREE.Group(); const w = .8, h = 1.8, d = .3, t = .025;
  for (const sx of [-1, 1]) box(g, WHITE, t, h, d, sx * (w / 2 - t / 2), 0, 0);
  for (let i = 0; i < 6; i++) box(g, WHITE, w - 2 * t, t, d, 0, .06 + i * (h - .06 - t) / 5, 0);
  box(g, WOOD, w - 2 * t, h - .06, .01, 0, .06, -(d / 2 - .005)); return g; }

function lamp() { const g = new THREE.Group();
  cyl(g, METAL, .15, .16, .03, 0, 0, 0); cyl(g, METAL, .012, .012, 1.25, 0, .03, 0); cyl(g, SHADE, .16, .22, .28, 0, 1.27, 0); return g; }

const ITEMS = { chair, table, sofa, shelf, lamp };
const b64 = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };

window.buildAll = async () => { const out = {};
  for (const [name, make] of Object.entries(ITEMS)) {
    const scene = new THREE.Scene(); const g = make(); g.name = name; scene.add(g); scene.updateMatrixWorld(true);
    const size = new THREE.Box3().setFromObject(g).getSize(new THREE.Vector3());
    const glb = await new GLTFExporter().parseAsync(scene, { binary: true });
    const usdz = await new USDZExporter().parseAsync(scene, { quickLookCompatible: true });
    out[name] = { glb: b64(glb), usdz: b64(usdz.buffer ?? usdz), size: [size.x, size.y, size.z] };
  } return out; };
window.ready = true;
</script>
